<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: #0f172a;
      color: #f1f5f9;
    }

    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      font-size: 18px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }

    .header .domain {
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .currency-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    select:focus {
      border-color: #3b82f6;
    }

    .swap-btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94a3b8;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .swap-btn:hover { color: #f1f5f9; }

    .rate-info {
      margin-top: 8px;
      font-size: 11px;
      color: #64748b;
    }

    .rate-info span {
      color: #7dd3fc;
    }

    /* Rule card */
    .rule-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .rule-card.active {
      border-color: #10b981;
    }

    .rule-selector {
      font-family: monospace;
      font-size: 11px;
      color: #7dd3fc;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .rule-meta {
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 500;
    }

    .badge-green {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #166534;
    }

    .badge-gray {
      background: #1e293b;
      color: #64748b;
      border: 1px solid #334155;
    }

    .rule-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-danger {
      background: #1e293b;
      color: #f87171;
      border: 1px solid #334155;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .pick-btn {
      width: 100%;
      padding: 10px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .pick-btn:hover { background: #2563eb; }
    .pick-btn.active { background: #b91c1c; }

    .empty-state {
      text-align: center;
      color: #475569;
      padding: 8px 0;
      font-size: 12px;
    }

    .no-rule-hint {
      font-size: 11px;
      color: #475569;
      margin-top: 8px;
      line-height: 1.5;
    }

    #status-msg {
      font-size: 11px;
      color: #64748b;
      padding: 8px 16px;
      text-align: center;
      min-height: 28px;
    }

    #status-msg.ok { color: #4ade80; }
    #status-msg.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">₿</div>
    <div>
      <h1>Currency Converter</h1>
      <div class="domain" id="current-domain">—</div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Conversion</div>
    <div class="currency-row">
      <select id="from-currency"></select>
      <button class="swap-btn" id="swap-btn" title="Swap currencies">⇄</button>
      <select id="to-currency"></select>
    </div>
    <div class="rate-info" id="rate-info">Loading rate…</div>
  </div>

  <div class="section">
    <div class="section-label">Site rule</div>
    <div id="rule-area"></div>
    <button class="pick-btn" id="pick-btn" style="margin-top: 10px">
      <span id="pick-icon">⊕</span>
      <span id="pick-label">Pick price element</span>
    </button>
    <p class="no-rule-hint" id="no-rule-hint" style="display:none">
      Click "Pick price element", then click any price on the page. The extension will detect similar elements and let you refine the selector.
    </p>
  </div>

  <div id="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
